name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore XivVault.sln

      - name: Build
        run: dotnet build XivVault.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution XivVault.sln --configuration Release --no-build

      - name: Format
        run: dotnet format XivVault.sln --verify-no-changes --no-restore

      - name: Smoke test
        shell: pwsh
        run: ./scripts/smoke-test.ps1 -Cli src/XivVault.Cli/bin/Release/net10.0/xiv-vault.dll
