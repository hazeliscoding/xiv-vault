name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore XIVault.sln

      - name: Build
        run: dotnet build XIVault.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution XIVault.sln --configuration Release --no-build

      - name: Format
        run: dotnet format XIVault.sln --verify-no-changes --no-restore
